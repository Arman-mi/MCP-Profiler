[project]
name = "mcp-profiler"
version = "0.1.0"
description = "Transparent stdio MCP proxy that timestamps JSON-RPC traffic for offline latency analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mcp-profiler = "mcp_profiler.cli:main"

[dependency-groups]
dev = [
    "mcp>=2.3.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_profiler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
